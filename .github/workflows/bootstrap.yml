name: Bootstrap repository source

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - source.part.*
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    if: github.event_name != 'issues' || github.event.issue.title == 'Bootstrap KingdomOS source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          cat source.part.* > /tmp/kingdomos-source.tar.gz.b64
          base64 --decode /tmp/kingdomos-source.tar.gz.b64 > /tmp/kingdomos-source.tar.gz
          tar -xzf /tmp/kingdomos-source.tar.gz -C .
          rm source.part.*
          rm .github/workflows/bootstrap.yml

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add RoK Events Command MVP"
          git push origin main

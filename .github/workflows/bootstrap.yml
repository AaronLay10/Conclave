name: Bootstrap repository source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail

          archive=/tmp/kingdomos-source.tar.gz
          : > "$archive"

          for part in $(find . -maxdepth 1 -type f -name 'source.part.*' | sort -V); do
            echo "Decoding $part"
            base64 --decode "$part" >> "$archive"
          done

          gzip -t "$archive"
          tar -xzf "$archive" -C .

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Set up Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm install --no-audit --no-fund

                - name: Typecheck
                  run: npm run typecheck

                - name: Lint
                  run: npm run lint

                - name: Build
                  run: npm run build
          YAML

          rm -f source.part.*
          rm -f tmp-noop*.txt
          rm -f .github/workflows/bootstrap.yml
          rm -rf scripts

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add RoK Events Command MVP"
          git push origin main

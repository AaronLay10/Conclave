name: Bootstrap repository source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t parts < <(
            find . -maxdepth 1 -type f -regextype posix-extended \
              -regex './source\.part\.[0-9]{2}' | sort -V
          )

          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No two-digit source archive segments were found."
            exit 1
          fi

          printf 'Using %s archive segments:\n' "${#parts[@]}"
          printf '  %s\n' "${parts[@]}"

          cat "${parts[@]}" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > /tmp/kingdomos-source.tar.gz

          gzip -t /tmp/kingdomos-source.tar.gz
          tar -xzf /tmp/kingdomos-source.tar.gz -C .

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Set up Node.js
                  uses: actions/setup-node@v6
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm install --no-audit --no-fund

                - name: Typecheck
                  run: npm run typecheck

                - name: Lint
                  run: npm run lint

                - name: Build
                  run: npm run build
          YAML

          rm -f source.part.*
          rm -f tmp-noop*.txt
          rm -f _*.txt _*.md
          rm -f .github/workflows/bootstrap.yml
          rm -rf scripts

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add RoK Events Command MVP"
          git push origin main
